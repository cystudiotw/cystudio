name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    # WordPress 發文／更新後由 mu-plugin 觸發（見 wordpress/cystudio-rebuild.php）
    types: [wp-update]
  schedule:
    # 每天 UTC 01:00（台灣 09:00）自動重建：抓取 WordPress 最新內容，新文章自動上站
    - cron: '0 1 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          # 預設已指向 wp.cystudio.tw（wordpress.js 的 fallback）。
          # 未來 WP 再搬家時，在 repo Settings → Secrets and variables → Actions →
          # Variables 新增 WP_URL 即可，程式不用改。
          WP_URL: ${{ vars.WP_URL }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout (purge script)
        uses: actions/checkout@v4
      - name: Purge Cloudflare cache
        # 等 GitHub Pages CDN 換上新版本，再清 Cloudflare 快取（HTML 快取一年，不清訪客會看到舊版）
        # 預設用 purge by hostname，只清 cystudio.tw / www.cystudio.tw，不動同 zone 的其他 custom hostname
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_PURGE_HOSTS: ${{ vars.CLOUDFLARE_PURGE_HOSTS }}
          CLOUDFLARE_PURGE_MODE: ${{ vars.CLOUDFLARE_PURGE_MODE }}
        run: |
          sleep 15
          node scripts/purge-cloudflare.mjs
